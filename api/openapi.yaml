    UARReviewerAssignmentPolicyEnum:
      description: "A policy for auto-assigning reviewers. If auto-assignment is on,\
        \ specific assignments can still be manually adjusted after the access review\
        \ is started. Default is Manually. BY_OWNING_TEAM_ADMIN assigns reviews to\
        \ resource admins in round-robin fashion. BY_OWNING_TEAM_ADMIN_ALL assigns\
        \ reviews to all resource admins. BY_APPROVERS assigns reviews to resource\
        \ approvers in round-robin fashion. BY_APPROVERS_ALL assigns reviews to all\
        \ resource approvers."
      enum:
      - MANUALLY
      - BY_OWNING_TEAM_ADMIN
      - BY_OWNING_TEAM_ADMIN_ALL
      - BY_MANAGER
      - BY_APPROVERS
      - BY_APPROVERS_ALL
      example: MANUALLY
      type: string
    TagFilter:
      description: A tag filter defined by the tags key and value.
      example:
        key: uar_scope
        value: high_priority
