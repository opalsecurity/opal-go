      example:
        created_at: 2021-01-06T20:00:00.000+00:00
        request_id: 4c86c85d-0651-43e2-a748-d69d658418e8
        user_id: c86c85d-0651-43e2-a748-d69d658418e8
        comment: This is a comment.
      properties:
        created_at:
          description: The date and time the comment was created.
          example: 2021-01-06T20:00:00.000+00:00
          format: date-time
          type: string
        request_id:
          description: The unique identifier of the request the comment is associated
            with.
          example: 7c86c85d-0651-43e2-a748-d69d658418e8
          format: uuid
          type: string
        user_id:
          description: The unique identifier of the user who made the comment.
          example: 7c86c85d-0651-43e2-a748-d69d658418e8
          format: uuid
          type: string
        user_full_name:
          description: The user's full name.
          example: Jake Barnes
          type: string
        user_email:
          description: The user's email address.
          example: jake.barnes@company.com
          type: string
        comment:
          description: The content of the comment.
          example: This is a comment.
          type: string
      required:
      - comment
      - created_at
      - request_id
      - user_id
