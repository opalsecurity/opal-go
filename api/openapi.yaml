components:
  schemas:
    AccessEntityFilters:
      description: "Filters for matching entities by type, name, tag, IDs, connections,\
        \ or access levels. Supports recursive logical composition via allOf/anyOf."
      properties:
        entityTypes:
          description: "Filter by entity type. Only RESOURCE, GROUP, and USER are\
            \ queryable via OpalQuery."
          items:
            enum:
            - RESOURCE
            - GROUP
            - USER
            type: string
          type: array
        entityItemTypes:
          description: Filter by entity item types.
          items:
            $ref: "#/components/schemas/EntityItemTypeEnum"
          type: array
        entityName:
          $ref: "#/components/schemas/EntityNameFilter"
        entityTag:
          $ref: "#/components/schemas/EntityTagFilter"
        entityIDs:
          description: Filter by specific entity UUIDs.
          items:
            format: uuid
            type: string
          type: array
        importedFromApp:
          description: Filter by app IDs from which returned nodes will be imported
            from.
          items:
            format: uuid
            type: string
          type: array
        roleRemoteIds:
          description: Filter by role remote IDs. Can only be applied within a hasAccessTo
            clause.
          items:
            type: string
          type: array
        roleNames:
          description: "Filter by role display names (e.g. \"Admin\", \"Read\"). Can\
            \ only be applied within a hasAccessTo clause."
          items:
            type: string
          type: array
        allOf:
          description: |
            A list of nested filters that must all match (logical AND). Each
             item has the same shape as this object — scalar fields like
             `entityTypes` or `entityTag`, and can further nest `allOf`,
             `anyOf`, or `not`.
          items:
            $ref: "#/components/schemas/AccessEntityFilters"
          type: array
        anyOf:
          description: |
            A list of nested filters where at least one must match (logical
             OR). Each item has the same shape as this object.
          items:
            $ref: "#/components/schemas/AccessEntityFilters"
          type: array
        not:
          description: |
            Excludes entities matching the embedded filter (logical NOT). Pass a filter object with the same shape as this one — typically a single scalar field, like `{not: {entityTypes: ["RESOURCE"]}}` to exclude resources.
          type: object
          x-go-type: AccessEntityFilters
    RunOpalQueryRequest:
      $ref: "#/components/schemas/OpalNodeQuery"
    OpalNodeQuery:
      description: "Request body for a NODE-type OpalQuery. Returns entities (users,\
        \ resources, groups) matching the given filters."
      example:
        type: NODE
        query:
          nodeFilters:
            entityTypes:
            - RESOURCE
            entityTag:
              key: env
              value: prod
          accessFilters:
            isAccessibleBy:
              entityTypes:
              - USER
              entityTag:
                key: contractor
        first: 50
      properties:
        type:
          enum:
          - NODE
          type: string
        query:
          $ref: "#/components/schemas/OpalNodeQueryBody"
        first:
          description: Maximum number of results to return. Defaults to 200.
          example: 200
          type: integer
        after:
          description: Cursor from a previous response to fetch the next page of results.
          example: 29827fb8-f2dd-4e80-9576-28e31e9934ac
          type: string
      required:
      - type
    OpalNodeQueryBody:
      description: The filter body for a NODE-type OpalQuery.
      properties:
        nodeFilters:
          $ref: "#/components/schemas/AccessEntityFilters"
        accessFilters:
          $ref: "#/components/schemas/AccessRelationshipFilters"
    OpalQueryResultNode:
      description: A matched entity from an OpalQuery result.
      example:
        entityItemType: OPAL_ROLE
        entityType: USER
        name: name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          description: The entity's unique identifier.
          format: uuid
          type: string
        name:
          description: The display name of the entity.
          type: string
        entityType:
          description: The top-level entity type.
          enum:
          - USER
          - GROUP
          - RESOURCE
          type: string
        entityItemType:
          $ref: "#/components/schemas/EntityItemTypeEnum"
      required:
      - entityItemType
      - entityType
      - id
      - name
    OpalQueryResultEdge:
      description: "A single result edge from an OpalQuery, containing the matched\
        \ entity and its pagination cursor."
      example:
        cursor: cursor
        node:
          entityItemType: OPAL_ROLE
          entityType: USER
          name: name
          id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        node:
          $ref: "#/components/schemas/OpalQueryResultNode"
        cursor:
          description: "Opaque cursor for this entity, used for pagination."
          type: string
      required:
      - cursor
      - node
    OpalQueryResults:
      $ref: "#/components/schemas/OpalNodeQueryResults"
    OpalNodeQueryResults:
      description: "Paginated results of a NODE-type OpalQuery — one edge per matched\
        \ entity (user, resource, or group)."
      example:
        edges:
        - cursor: cursor
          node:
            entityItemType: OPAL_ROLE
            entityType: USER
            name: name
            id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - cursor: cursor
          node:
            entityItemType: OPAL_ROLE
            entityType: USER
            name: name
            id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        pageInfo:
          hasNextPage: true
          hasPreviousPage: true
          endCursor: endCursor
          startCursor: startCursor
        type: NODE
      properties:
        type:
          enum:
          - NODE
          type: string
        edges:
          description: List of matched entities.
          items:
            $ref: "#/components/schemas/OpalQueryResultEdge"
          type: array
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
      required:
      - edges
      - pageInfo
      - type
    AccessRelationshipFilters:
      description: |
        Filters the returned nodes by the access edges connected to them. When `isAccessibleBy` and `hasAccessTo` are provided, the returned nodes must satisfy both edge constraints simultaneously.
      properties:
        isAccessibleBy:
          allOf:
          - $ref: "#/components/schemas/AccessEntityFilters"
          description: Inbound-edge filter. The returned node must be accessible by
            at least one entity matching this filter.
        hasAccessTo:
          allOf:
          - $ref: "#/components/schemas/AccessEntityFilters"
          description: Outbound-edge filter. The returned node must have access to
            at least one entity matching this filter.
    EntityNameFilter:
      description: Filters entities by name using a string match strategy.
      properties:
        stringMatchType:
          $ref: "#/components/schemas/StringMatchType"
        string:
          description: The string value to match against the entity name.
          example: engineering
          type: string
      required:
      - string
      - stringMatchType
    EntityTagFilter:
      description: "Filters entities by a tag key/value pair, optionally scoped to\
        \ a connection."
      properties:
        key:
          description: The tag key to filter by.
          example: team
          type: string
        value:
          description: "The tag value to filter by. If omitted, matches any value\
            \ for the given key."
          example: platform
          type: string
        connectionId:
          description: "If specified, filters by tags associated with this connection."
          format: uuid
          type: string
      required:
      - key
    StringMatchType:
      description: How to match a string value against entity names.
      enum:
      - CONTAINS
      - EQUALS
      - STARTS_WITH
      - ENDS_WITH
      type: string
    PaginatedAssignedRequestList:
      properties:
        requests:
          items:
            $ref: "#/components/schemas/Request"
          type: array
        cursor:
          description: The cursor to continue pagination
          type: string
      required:
      - cursor
      - requests
    PageInfo:
      example:
        hasNextPage: true
        hasPreviousPage: true
        endCursor: endCursor
        startCursor: startCursor
      properties:
        hasNextPage:
          description: Whether there are more items after the end cursor
          type: boolean
        endCursor:
          description: The cursor to continue pagination forwards
          type: string
        hasPreviousPage:
          description: Whether there are more items before the start cursor
          type: boolean
        startCursor:
          description: The cursor to continue pagination backwards
          type: string
      required:
      - endCursor
      - hasNextPage
      - hasPreviousPage
      - startCursor
