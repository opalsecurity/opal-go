          - 37cb7e41-12ba-46da-92ff-030abe0450b2
          stage: 1
        priority: 1
      properties:
        condition:
          allOf:
          - $ref: "#/components/schemas/Condition"
          description: The condition for the request configuration.
        allow_requests:
