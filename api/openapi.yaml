openapi: 3.1.0
info:
  contact:
    email: hello@opal.dev
    name: Opal Team
    url: https://www.opal.dev/
  description: The Opal API is a RESTful API that allows you to interact with the
    Opal Security platform programmatically.
  title: Opal API
  version: "1.0"
servers:
- description: Production
  url: https://api.opal.dev/v1
tags:
- description: Operations related to access rules
  name: access-rules
- description: Operations related to apps
  name: apps
- description: Operations related to bundles
  name: bundles
- description: Operations related to configuration templates
  name: configuration-templates
- description: Operations related to request reviewer delegations
  name: delegations
- description: Operations related to event streaming connections
  name: event-streams
- description: Operations related to events
  name: events
- description: Operations related to groups
  name: groups
- description: Operations related to group bindings
  name: group-bindings
- description: Operations related to IDP group mappings
  name: idp-group-mappings
- description: Operations related to message channels
  name: message-channels
- description: Operations related to non-human identities
  name: non-human-identities
- description: Operations related to on-call schedules
  name: on-call-schedules
- description: Operations related to OpalQuery
  name: opal-queries
- description: Operations related to owners
  name: owners
- description: Operations related to requests
  name: requests
- description: Operations related to resources
  name: resources
- description: Operations related to sessions
  name: sessions
- description: Operations related to tags
  name: tags
- description: Operations related to API tokens
  name: tokens
- description: Operations related to UARs
  name: uars
- description: Operations related to users
  name: users
paths:
  /apps:
    get:
      description: Returns a list of `App` objects.
      operationId: getApps
      parameters:
      - description: A list of app types to filter by.
        example:
        - OKTA_DIRECTORY
        - GIT_HUB
        explode: false
        in: query
        name: app_type_filter
        required: false
        schema:
          items:
            $ref: "#/components/schemas/AppTypeEnum"
          type: array
        style: form
      - description: An owner ID to filter by.
        example: 29827fb8-f2dd-4e80-9576-28e31e9934ac
        explode: true
        in: query
        name: owner_filter
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppsList"
          description: A list of apps for your organization.
      security:
      - BearerAuth: []
      summary: Get apps
      tags:
      - apps
  /apps/{app_id}:
    get:
      description: Returns an `App` object.
      operationId: getApp
      parameters:
      - description: The ID of the app.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: true
        in: path
        name: app_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
          description: The requested `App`.
      security:
      - BearerAuth: []
      summary: Get app by ID
      tags:
      - apps
  /bundles:
    get:
      description: Returns a list of `Bundle` objects.
      operationId: getBundles
      parameters:
      - description: "The maximum number of bundles to return from the beginning of\
          \ the list. Default is 200, max is 1000."
        example: 200
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - description: A cursor indicating where to start fetching items after a specific
          point.
        example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: A filter for the bundle name.
        example: Engineering
        explode: true
        in: query
        name: contains
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBundleList"
          description: A list of bundles for your organization.
      security:
      - BearerAuth: []
      summary: Get bundles
      tags:
      - bundles
    post:
      description: Creates a bundle.
      operationId: createBundle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBundleInfo"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
          description: The bundle successfully created.
      security:
      - BearerAuth: []
      tags:
      - bundles
  /bundles/{bundle_id}:
    delete:
      description: Deletes a bundle.
      operationId: deleteBundle
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: true
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: The bundle was successfully deleted.
      security:
      - BearerAuth: []
      tags:
      - bundles
    get:
      description: Returns a `Bundle` object.
      operationId: getBundle
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: true
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
          description: The requested `Bundle`.
      security:
      - BearerAuth: []
      summary: Get bundle by ID
      tags:
      - bundles
    put:
      description: Updates a bundle.
      operationId: updateBundle
      parameters:
      - description: The ID of the bundle to be updated.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Bundle"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
          description: The bundle was successfully updated.
        "204":
          description: No changes detected (no-op)
      security:
      - BearerAuth: []
      tags:
      - bundles
  /bundles/{bundle_id}/resources:
    get:
      description: Returns a list of `Resource` objects in a given bundle.
      operationId: getBundleResources
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "The maximum number of resources to return from the beginning\
          \ of the list. Default is 200, max is 1000."
        example: 200
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - description: A cursor indicating where to start fetching items after a specific
          point.
        example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBundleResourceList"
          description: A list of resources for the bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
    post:
      description: Adds a resource to a bundle.
      operationId: addBundleResource
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addBundleResource_request"
        required: false
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleResource"
          description: Resource was successfully added to the bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
  /bundles/{bundle_id}/resources/{resource_id}:
    delete:
      description: Removes a resource from a bundle.
      operationId: removeBundleResource
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The ID of the resource to remove.
        example: 72e75a6f-7183-48c5-94ff-6013f213314b
        explode: false
        in: path
        name: resource_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "The remote ID of the access level to grant. If omitted, the\
          \ default access level remote ID value (empty string) is used."
        example: arn:aws:iam::590304332660:role/AdministratorAccess
        explode: true
        in: query
        name: access_level_remote_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Resource was successfully removed from the bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
  /bundles/{bundle_id}/groups:
    get:
      description: Returns a list of `Group` objects in a given bundle.
      operationId: getBundleGroups
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "The maximum number of groups to return from the beginning of\
          \ the list. Default is 200, max is 1000."
        example: 200
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      - description: A cursor indicating where to start fetching items after a specific
          point.
        example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBundleGroupList"
          description: A list of groups for the bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
    post:
      description: Adds a group to a bundle.
      operationId: addBundleGroup
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addBundleGroup_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleGroup"
          description: Group was successfully added to the bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
  /bundles/{bundle_id}/groups/{group_id}:
    delete:
      description: Removes a group from a bundle.
      operationId: removeBundleGroup
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The ID of the group to remove.
        example: 72e75a6f-7183-48c5-94ff-6013f213314b
        explode: false
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The remote ID of the access level to remove.
        example: arn:aws:iam::590304332660:role/AdministratorAccess
        explode: true
        in: query
        name: access_level_remote_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Group was successfully removed from the bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
  /bundles/{bundle_id}/visibility:
    get:
      description: Gets the visibility of the bundle.
      operationId: getBundleVisibility
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityInfo"
          description: The visibility details of a bundle.
      security:
      - BearerAuth: []
      tags:
      - bundles
    put:
      description: Sets the visibility of the bundle.
      operationId: setBundleVisibility
      parameters:
      - description: The ID of the bundle.
        example: 32acc112-21ff-4669-91c2-21e27683eaa1
        explode: false
        in: path
        name: bundle_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/VisibilityInfo"
              description: The visibility details of the bundle. Setting to LIMITED
                visibility with no visibility groups will make bundle only visible
                to admins and users with access.
        required: true
      responses:
        "200":
          description: The visibility details of the bundle were successfully set.
      security:
      - BearerAuth: []
      tags:
      - bundles
  /configuration-templates:
    get:
      description: Returns a list of `ConfigurationTemplate` objects.
      operationId: getConfigurationTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedConfigurationTemplateList"
          description: One page worth of configuration templates for your organization.
      security:
      - BearerAuth: []
      tags:
      - configuration-templates
    post:
      description: Creates a configuration template.
      operationId: createConfigurationTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigurationTemplateInfo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationTemplate"
          description: The configuration template just created.
      security:
      - BearerAuth: []
      tags:
      - configuration-templates
    put:
      description: Update a configuration template.
      operationId: updateConfigurationTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigurationTemplateInfo"
        description: Configuration template to be updated
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationTemplate"
          description: The configuration template just updated.
      security:
      - BearerAuth: []
      tags:
      - configuration-templates
  /configuration-templates/{configuration_template_id}:
    delete:
      description: Deletes a configuration template.
      operationId: deleteConfigurationTemplate
      parameters:
      - description: The ID of the configuration template.
        example: 4baf8423-db0a-4037-a4cf-f79c60cb67a5
        explode: false
        in: path
        name: configuration_template_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: The configuration template was successfully deleted.
      security:
      - BearerAuth: []
      tags:
      - configuration-templates
  /event-streams:
    get:
      description: Returns a list of configured event streaming connections for your
        organization.
      operationId: getEventStreams
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStreamList"
          description: A list of event streams for your organization.
      security:
      - BearerAuth: []
      summary: Get event streams
      tags:
      - event-streams
    post:
      description: Creates a new event streaming connection.
      operationId: createEventStream
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventStreamInfo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStream"
          description: The event stream just created. Credentials are returned in
            clear text only on creation.
      security:
      - BearerAuth: []
      summary: Create event stream
      tags:
      - event-streams
  /event-streams/{event_stream_id}:
    delete:
      description: Deletes an event streaming connection.
      operationId: deleteEventStream
      parameters:
      - description: The ID of the event stream.
        example: 4baf8423-db0a-4037-a4cf-f79c60cb67a5
        explode: false
        in: path
        name: event_stream_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: The event stream was successfully deleted.
      security:
      - BearerAuth: []
      summary: Delete event stream
      tags:
      - event-streams
    put:
      description: Updates an existing event streaming connection.
      operationId: updateEventStream
      parameters:
      - description: The ID of the event stream.
        example: 4baf8423-db0a-4037-a4cf-f79c60cb67a5
        explode: false
        in: path
        name: event_stream_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventStreamInfo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStream"
          description: The updated event stream.
      security:
      - BearerAuth: []
      summary: Update event stream
      tags:
      - event-streams
  /events:
    get:
      description: Returns a list of `Event` objects.
      operationId: events
      parameters:
      - description: A start date filter for the events.
        examples:
          withDate:
            summary: Example with date
            value: 2021-11-01
          withDatetime:
            summary: Example with date and time in ISO 8601 datetime format.
            value: 2025-01-01T00:00:00Z
        explode: true
        in: query
        name: start_date_filter
        required: false
        schema:
          type: string
        style: form
      - description: An end date filter for the events.
        examples:
          withDate:
            summary: Example with date
            value: 2021-11-12
          withDatetime:
            summary: Example with date and time in ISO 8601 datetime format.
            value: 2025-01-01T00:00:00Z
        explode: true
        in: query
        name: end_date_filter
        required: false
        schema:
          type: string
        style: form
      - description: An actor filter for the events. Supply the ID of the actor.
        example: 29827fb8-f2dd-4e80-9576-28e31e9934ac
        explode: true
        in: query
        name: actor_filter
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: An object filter for the events. Supply the ID of the object.
        example: 29827fb8-f2dd-4e80-9576-28e31e9934ac
        explode: true
        in: query
        name: object_filter
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: An event type filter for the events.
        example: USER_MFA_RESET
        explode: true
        in: query
        name: event_type_filter
        required: false
        schema:
          type: string
        style: form
      - description: An API filter for the events. Supply the name and preview of
          the API token.
        example: fullaccess:**************************M_g==
        explode: true
        in: query
        name: api_token_filter
        required: false
        schema:
          type: string
        style: form
      - description: The pagination cursor value.
        example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: Number of results to return per page. Default is 200.
        example: 200
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEventList"
          description: One page worth of events with the appropriate filters applied.
      security:
      - BearerAuth: []
      tags:
      - events
  /events/{event_id}:
    get:
      description: Returns an `Event` object.
      operationId: getEvent
      parameters:
      - description: The ID of the event.
        example: 29827fb8-f2dd-4e80-9576-28e31e9934ac
        explode: true
        in: path
        name: event_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
          description: The requested `Event`.
        "404":
          description: Event not found.
      security:
      - BearerAuth: []
      summary: Get event by ID
      tags:
      - events
  /groups:
    get:
      description: Returns a list of groups for your organization.
      operationId: getGroups
      parameters:
      - description: The pagination cursor value.
        example: cD0yMDIxLTAxLTA2KzAzJTNBMjQlM0E1My40MzQzMjYlMkIwMCUzQTAw
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: Number of results to return per page. Default is 200.
        example: 200
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          type: integer
        style: form
      - description: The group type to filter by.
        example: OPAL_GROUP
        explode: true
        in: query
        name: group_type_filter
        required: false
        schema:
          $ref: "#/components/schemas/GroupTypeEnum"
        style: form
      - description: The group ids to filter by.
        example:
        - 4baf8423-db0a-4037-a4cf-f79c60cb67a5
        - 1b978423-db0a-4037-a4cf-f79c60cb67b3
        explode: false
        in: query
        name: group_ids
        required: false
        schema:
          items:
            example: 1b978423-db0a-4037-a4cf-f79c60cb67b3
            format: uuid
            type: string
          type: array
        style: form
      - description: Group name.
        example: example-name
        explode: true
        in: query
        name: group_name
        required: false
        schema:
          type: string
        style: form
      - description: The IDs of the tags to filter by. Returns only groups that have
          any of these tags applied.
        explode: true
        in: query
        name: tag_ids
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGroupsList"
          description: One page worth groups associated with your organization.
      security:
      - BearerAuth: []
      summary: Get groups
      tags:
      - groups
    post:
      description: "Creates an Opal group or [imports a remote group](https://docs.opal.dev/reference/end-system-objects)."
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInfo"
        required: true
      responses:
        "200":
