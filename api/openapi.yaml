          description: The ID of the group.
          example: f454d283-ca87-4a87-bdbb-df212eca5353
          format: uuid
          type: string
        resource_id:
          description: The ID of the resource.
          example: b5a5ca27-0ea3-4d86-9199-2126d57d1fbd
          format: uuid
          type: string
        group_name:
          description: The name of the group
          example: API Group
          type: string
        resource_name:
          description: The name of the resource
          example: API Group
          type: string
        expiration_date:
          description: The day and time the group's access will expire.
          example: 2022-01-23T04:56:07.000+00:00
          format: date-time
          type: string
          nullable: true
        access_level:
          $ref: "#/components/schemas/ResourceAccessLevel"
      required:
