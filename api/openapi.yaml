      - resource_id
    GroupContainingGroup:
      description: |-
        # GroupContainingGroup Object
        ### Description
        The `GroupContainingGroup` object is used to represent a relationship between a group and a group.
      example:
        containing_group_id: f454d283-ca87-4a8a-bdbb-df212eca5353
      properties:
        containing_group_id:
          description: The groupID of the containing group.
          example: f454d283-ca87-4a8a-bdbb-df212eca5353
          format: uuid
          type: string
        duration_minutes:
          description: The updated duration for which the group can be accessed (in
            minutes). Use 0 for indefinite.
          example: 120
          maximum: 525960
          type: integer
        access_level_remote_id:
          description: The updated remote ID of the access level granted to this group.
          example: arn:aws:iam::590304332660:role/ReadOnlyAccess
          type: string
      required:
      - containing_group_id
    Group:
      description: |-
        # Group Object
        ### Description
        The `Group` object is used to represent a group.

        ### Usage Example
        Update from the `UPDATE Groups` endpoint.
      example:
        group_id: f454d283-ca87-4a8a-bdbb-df212eca5353
        app_id: b5a5ca27-0ea3-4d86-9199-2126d57d1fbd
        name: Payments Production Admin
        description: This group represents Active Directory group "Payments Production
          Admin". We use this AD group to facilitate staging deployments and qualifying
          new releases.
        admin_owner_id: 7c86c85d-0651-43e2-a748-d69d658418e8
        group_leader_user_ids:
        - 7c86c85d-0651-43e2-a748-d69d658418e8
        remote_id: 037m2jsg218b2wb
        remote_name: Finance Team
        group_type: ACTIVE_DIRECTORY_GROUP
        max_duration: 120
        recommended_duration: 60
        extensions_duration_in_minutes: 60
        require_manager_approval: false
        require_support_ticket: false
        require_mfa_to_approve: false
        require_mfa_to_request: false
        auto_approval: false
        is_requestable: true
      properties:
        group_id:
          description: The ID of the group.
          example: f454d283-ca87-4a8a-bdbb-df212eca5353
          format: uuid
          type: string
        app_id:
          description: The ID of the group's app.
          example: b5a5ca27-0ea3-4d86-9199-2126d57d1fbd
          format: uuid
          type: string
        name:
          description: The name of the group.
          example: API Group
          type: string
        description:
          description: A description of the group.
          example: This group represents Active Directory group "Payments Production
            Admin". We use this AD group to facilitate staging deployments and qualifying
            new releases.
          type: string
        admin_owner_id:
          description: The ID of the owner of the group.
          example: 7c86c85d-0651-43e2-a748-d69d658418e8
          format: uuid
          type: string
        group_leader_user_ids:
          description: A list of User IDs for the group leaders of the group
          items:
            format: uuid
            type: string
          type: array
        remote_id:
          description: The ID of the remote.
          example: google-group-group:037m2jsg218b2wb
          type: string
        remote_name:
          description: The name of the remote.
          example: Finance team
          type: string
        group_type:
          $ref: "#/components/schemas/GroupTypeEnum"
        max_duration:
          description: The maximum duration for which the group can be requested (in
            minutes).
          example: 120
          type: integer
        recommended_duration:
          description: The recommended duration for which the group should be requested
            (in minutes). -1 represents an indefinite duration.
          example: 120
          type: integer
        extensions_duration_in_minutes:
          description: "The duration for which access can be extended (in minutes).\
            \ Set to 0 to disable extensions. When > 0, extensions are enabled for\
            \ the specified duration."
          example: 120
          type: integer
        require_manager_approval:
          deprecated: true
          description: A bool representing whether or not access requests to the group
            require manager approval.
          example: false
          type: boolean
        require_support_ticket:
          description: A bool representing whether or not access requests to the group
            require an access ticket.
          example: false
          type: boolean
        require_mfa_to_approve:
          description: A bool representing whether or not to require MFA for reviewers
            to approve requests for this group.
          example: false
          type: boolean
        require_mfa_to_request:
          description: A bool representing whether or not to require MFA for requesting
            access to this group.
          example: false
          type: boolean
        auto_approval:
          description: A bool representing whether or not to automatically approve
            requests to this group.
          example: false
          type: boolean
        request_template_id:
          description: The ID of the associated request template.
          example: 06851574-e50d-40ca-8c78-f72ae6ab4304
          format: uuid
          type: string
        configuration_template_id:
          description: The ID of the associated configuration template.
          example: 06851574-e50d-40ca-8c78-f72ae6ab4304
          format: uuid
          type: string
        group_binding_id:
          description: The ID of the associated group binding.
          example: 06851574-e50d-40ca-8c78-f72ae6ab4304
          format: uuid
          type: string
        is_requestable:
          description: A bool representing whether or not to allow access requests
            to this group.
          example: false
          type: boolean
        request_configurations:
          description: A list of request configurations for this group.
          example: []
          items:
            $ref: "#/components/schemas/RequestConfiguration"
          type: array
        request_configuration_list:
          description: A list of request configurations for this group. Deprecated
            in favor of `request_configurations`.
          example: []
          items:
            $ref: "#/components/schemas/RequestConfiguration"
          type: array
        metadata:
          deprecated: true
          description: "JSON metadata about the remote group. Only set for items linked\
            \ to remote systems. See [this guide](https://docs.opal.dev/reference/end-system-objects)\
            \ for details."
          example: "{ \"okta_directory_group\": { \"group_id\": \"00g4bs66kwtpe1g12345\"\
            \ } }"
          type: string
        remote_info:
          $ref: "#/components/schemas/GroupRemoteInfo"
        custom_request_notification:
          description: Custom request notification sent to the requester when the
            request is approved.
          example: Check your email to register your account.
          maxLength: 800
          type: string
          nullable: true
        risk_sensitivity:
          allOf:
          - $ref: "#/components/schemas/RiskSensitivityEnum"
          description: "The risk sensitivity level for the group. When an override\
            \ is set, this field will match that."
          readOnly: true
        risk_sensitivity_override:
          allOf:
          - $ref: "#/components/schemas/RiskSensitivityEnum"
        last_successful_sync:
          allOf:
          - $ref: "#/components/schemas/SyncTask"
          description: Information about the last successful sync of this group.
          readOnly: true
      required:
      - group_id
