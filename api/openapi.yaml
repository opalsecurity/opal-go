          type: boolean
        num_access_paths:
          description: The number of ways in which the user has access through this
            resource (directly and indirectly).
          example: 3
          format: int32
          type: integer
        propagation_status:
          $ref: "#/components/schemas/PropagationStatus"
      required:
      - access_level
      - email
      - full_name
      - has_direct_access
      - num_access_paths
      - resource_id
      - user_id
